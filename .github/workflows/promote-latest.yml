name: Promote Staging to Latest

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: '待晋级的源镜像标签 (默认 staging，可指定如 staging-bc825cd)'
        required: true
        default: 'staging'
        type: string
      version:
        description: '发布版本号 Tag (可选，例如 v1.0.0。留空则仅发布 latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    name: Promote Image Tags
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote staging image to latest
        run: |
          set -euo pipefail

          # 确保仓库路径全小写以符合 Docker 规范
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_LOWER}"

          # 获取待晋级的源标签（默认为 staging，允许用户传入特定版本如 staging-bc825cd）
          RAW_SOURCE_TAG="${{ inputs.source_tag }}"
          SOURCE_TAG=$(echo "${RAW_SOURCE_TAG}" | xargs)
          if [ -z "${SOURCE_TAG}" ]; then
            SOURCE_TAG="staging"
          fi
          SOURCE_IMAGE="${IMAGE_BASE}:${SOURCE_TAG}"

          echo "==> 检查源测试镜像是否存在: ${SOURCE_IMAGE} ..."
          docker buildx imagetools inspect "${SOURCE_IMAGE}"

          # 准备目标 Tag 参数列表
          TAG_ARGS=("--tag" "${IMAGE_BASE}:latest")

          RAW_VERSION="${{ inputs.version }}"
          VERSION=$(echo "${RAW_VERSION}" | xargs)

          if [ -n "${VERSION}" ]; then
            echo "==> 检测到发布版本号: ${VERSION}"
            TAG_ARGS+=("--tag" "${IMAGE_BASE}:${VERSION}")
          fi

          echo "==> 正在执行镜像晋级 (基于 ${SOURCE_IMAGE} 在 Registry 端创建 Tag，秒级发布)..."
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCE_IMAGE}"

          echo "==> 晋级完成！"

          # 写入 GitHub Step Summary
          echo "### 🚀 镜像晋级成功 (Promotion Succeeded)" >> $GITHUB_STEP_SUMMARY
          echo "- **源测试镜像 (Source)**: \`${SOURCE_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **已晋级发布的正式 Tag**:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${IMAGE_BASE}:latest\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${VERSION}" ]; then
            echo "  - \`${IMAGE_BASE}:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "生产环境可直接拉取 \`${IMAGE_BASE}:latest\` 进行部署或平滑重启。" >> $GITHUB_STEP_SUMMARY
