name: Build & Push Staging Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到测试 VPS (Deploy to VPS)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Compile check
        run: uv run python -m compileall -q src

      - name: Run Pytest
        run: uv run pytest -q

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  build-staging:
    name: Build & Push Staging Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Staging Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print Summary
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "### 📦 Staging 镜像构建并推送成功" >> $GITHUB_STEP_SUMMARY
          echo "已推送到 GHCR，请在测试 VPS 上拉取验证：" >> $GITHUB_STEP_SUMMARY
          echo "- **固定测试 Tag**: \`ghcr.io/${REPO_LOWER}:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA 追溯 Tag**: \`ghcr.io/${REPO_LOWER}:staging-${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **安全机制**：此阶段绝对不打 \`:latest\` 标签。VPS 手动验证无误后，请在 Actions 页面触发 \`promote-latest.yml\` 晋级发布。" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy to Test VPS
    needs: build-staging
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true) ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip deploy]') &&
       !contains(github.event.head_commit.message, '[no deploy]') &&
       !contains(github.event.head_commit.message, '[skip-deploy]') &&
       vars.AUTO_DEPLOY_STAGING != 'false')
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -e
            echo "==> 1. 进入 VPS 部署目录..."
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "==> 2. 拉取最新 staging 镜像..."
            docker compose -f docker-compose.staging.yml pull

            echo "==> 3. 平滑更新并重启服务..."
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            echo "==> 4. 清理旧版本孤儿镜像..."
            docker image prune -f

            echo "==> 5. 检查当前容器状态..."
            docker compose -f docker-compose.staging.yml ps

      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 测试 VPS 自动部署执行完成" >> $GITHUB_STEP_SUMMARY
          echo "- **部署目标主机**: \`${{ secrets.VPS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **服务状态**: 镜像已拉取并平滑重启" >> $GITHUB_STEP_SUMMARY
