# ==============================================================================
# 生产环境 / 本机运行 Docker Compose 配置
# 镜像源：GitHub Container Registry (ghcr.io/aoki222/tg-up:latest)
#
# 快速开始：
#   1. 复制 .env.example 为 .env 并配置参数：
#      cp .env.example .env
#   2. 拉取正式镜像：
#      docker compose pull
#   3. 启动/平滑更新容器：
#      docker compose up -d --remove-orphans
#   4. 查看控制台：http://<服务器IP>:8421/
# ==============================================================================

services:
  tg-up:
    image: ghcr.io/aoki222/tg-up:latest
    container_name: tg-up
    restart: unless-stopped
    ports:
      - "8421:8421"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8421"
      APP_CHANNEL: "latest"
    volumes:
      - ./download:/app/download
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./page:/app/page
      - ./uploaded:/app/uploaded
      - ./logs:/app/logs
      # 宿主机外部下载目录挂载示例（如需要请取消注释）
      # - /home/scrapy/data/download:/data/scrapy-download
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8421/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
