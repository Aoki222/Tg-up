# VPS / 本机：
#   1. cp .env.example .env   填 API_ID / API_HASH
#   2. docker compose up -d --build
# 控制台：http://<服务器IP>:8000/
# 视频放到 ./download ；session 放到 ./sessions
# 上传配置在 ./data/upload.toml（目录挂载，控制台保存不会 EBUSY）

services:
  uploader:
    build: .
    image: uploader:local
    container_name: uploader
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    volumes:
      - ./download:/app/download
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./page:/app/page
      - ./uploaded:/app/uploaded
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
