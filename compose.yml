# 使用前：
#   1. 复制 .env.example 为 .env，填 API_ID / API_HASH
#   2. 可选：复制 upload.toml.example 为 upload.toml（没有时容器会自动复制一份）
#   3. docker compose up -d --build
#
# 控制台：http://localhost:8000/
# 把视频放进 ./download（对应容器内 /app/download）

services:
  uploader:
    build: .
    image: uploader:local
    container_name: uploader
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    volumes:
      - ./download:/app/download
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./page:/app/page
      - ./uploaded:/app/uploaded
      - ./logs:/app/logs
      # 请先: cp upload.toml.example upload.toml ，否则 Docker 会把这个路径做成目录
      - ./upload.toml:/app/upload.toml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
